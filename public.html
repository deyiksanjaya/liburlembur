    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(15px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        },
                        pulseRed: {
                            '0%, 100%': { opacity: '1' },
                            '50%': { opacity: '0.6' }
                        },
                        bounceSoft: {
                            '0%, 100%': { transform: 'translateY(-5%)' },
                            '50%': { transform: 'translateY(0)' }
                        }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'pulse-fast': 'pulseRed 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-soft': 'bounceSoft 2s ease-in-out infinite'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

            50% { transform: rotate(180deg) scale(1.15); }

    </style>
</head>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

        import { getFirestore, doc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDW4v73HwelLT9No71Hf-Mv1o_fahRPCe8",
            authDomain: "personal-everyday-app.firebaseapp.com",
            projectId: "personal-everyday-app",
            storageBucket: "personal-everyday-app.firebasestorage.app",
            messagingSenderId: "1015611090690",
            appId: "1:1015611090690:web:0437791caac99f1449841b"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const appIdString = "libur-lembur-tracker-v1";
        // ID statis yang sama dengan aplikasi utama untuk membaca/menulis data spesifik Heri
        const targetUserId = "my_personal_account"; 
        
        let selectedDates = []; 
        let yukyuDates = []; 
        let appSettings = {
            startTime: '07:00',
            endTime: '17:00',
            theme: 'light',
            language: 'id',
            overtimeLogs: {},
            customShifts: {}
        };

        let progressInterval;
        let currentViewDate = new Date();
        window.lastCheckedDateStr = null;

        // Check for ?for= parameter
        const urlParams = new URLSearchParams(window.location.search);
        const forName = urlParams.get('for');
        if (forName) {

        // Custom Modal Function
        window.showModal = function(title, message, isSuccess) {
            const modal = document.getElementById('custom-modal');
            const icon = document.getElementById('modal-icon');
            
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            
            if (isSuccess) {
                icon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl bg-teal-100 dark:bg-teal-900/50 text-teal-500 shadow-inner";
                icon.innerHTML = "✨";
            } else {
                icon.className = "w-12 h-12 rounded-full mx-auto mb-4 flex items-center justify-center text-3xl bg-amber-100 dark:bg-amber-900/50 text-amber-500 shadow-inner";
                icon.innerHTML = "👀";
            }
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modal.querySelector('div').classList.remove('scale-95');
            }, 10);
        }

        window.closeModal = function() {
            const modal = document.getElementById('custom-modal');
            modal.classList.add('opacity-0');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function toYYYYMMDD(dateObj) {
            const y = dateObj.getFullYear();
            const m = String(dateObj.getMonth() + 1).padStart(2, '0');
            const d = String(dateObj.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function applyTheme() {
            let isDark = false;
            if (appSettings.theme === 'dark') isDark = true;
            else if (appSettings.theme === 'light') isDark = false;
            else isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (isDark) document.documentElement.classList.add('dark');
            else document.documentElement.classList.remove('dark');
        }

        function calculateStatus() {
            const today = new Date();
            today.setHours(0,0,0,0);
            const todayStr = toYYYYMMDD(today);
            
            const isHolidayToday = selectedDates.includes(todayStr) || yukyuDates.includes(todayStr);

            let workingDaysLeft = 0;
            let calendarDaysLeft = 0;
            let nextHolidayStr = null;
            let checkDate = new Date(today);

            if (isHolidayToday) {
                while (selectedDates.includes(toYYYYMMDD(checkDate)) || yukyuDates.includes(toYYYYMMDD(checkDate))) {
                    checkDate.setDate(checkDate.getDate() + 1);
                }
            }

            let tempDate = new Date(checkDate);
            while (calendarDaysLeft < 365) { 
                const dStr = toYYYYMMDD(tempDate);
                if (selectedDates.includes(dStr) || yukyuDates.includes(dStr)) {
                    nextHolidayStr = dStr;
                    break;
                } else {
                    workingDaysLeft++;
                }
                calendarDaysLeft++;
                tempDate.setDate(tempDate.getDate() + 1);
            }

            let totalCalendarDays = 0;
            if (nextHolidayStr) {
                const nextHDate = new Date(nextHolidayStr);
                totalCalendarDays = Math.ceil((nextHDate - today) / (1000 * 60 * 60 * 24));
            }

            return { isHolidayToday, workingDaysLeft, totalCalendarDays, nextHolidayStr };
        }

        window.updateWorkdayCountdown = function() {
            const shiftText = document.getElementById('shift-countdown-text');
            const labelText = document.getElementById('shift-countdown-label');
            if (!shiftText || !labelText) return;

            const now = new Date();
            const todayStr = toYYYYMMDD(now);
            
            // Fix Midnight Bug & Refresh on Day Change
            if (!window.lastCheckedDateStr) window.lastCheckedDateStr = todayStr;
            if (window.lastCheckedDateStr !== todayStr) {
                window.lastCheckedDateStr = todayStr;
                renderDashboard();
                renderCalendar();
                return; 
            }
            
            let baselineStart = appSettings.startTime || '07:00';
            let baselineEnd = appSettings.endTime || '17:00';
            
            if (appSettings.customShifts && appSettings.customShifts[todayStr]) {
                const shiftData = appSettings.customShifts[todayStr];
                // Handling both legacy string format and new object format
                if (typeof shiftData === 'string') {
                    baselineEnd = shiftData;
                } else {
                    baselineStart = shiftData.start || baselineStart;
                    baselineEnd = shiftData.end || baselineEnd;
                }
            }
            
            const [startHr, startMin] = baselineStart.split(':').map(Number);
            const [endHr, endMin] = baselineEnd.split(':').map(Number);
            
            let startOfShift = new Date(now.getFullYear(), now.getMonth(), now.getDate(), startHr, startMin, 0);
            let endOfShift = new Date(now.getFullYear(), now.getMonth(), now.getDate(), endHr, endMin, 0);
            
            // Adjust for cross-midnight shifts
            if (endOfShift <= startOfShift) {
                endOfShift.setDate(endOfShift.getDate() + 1); 
            }

            // Check if we are currently inside the night shift that started YESTERDAY
            let yesterdayStart = new Date(startOfShift);
            yesterdayStart.setDate(yesterdayStart.getDate() - 1);
            let yesterdayEnd = new Date(endOfShift);
            yesterdayEnd.setDate(yesterdayEnd.getDate() - 1);

            if (now >= yesterdayStart && now < yesterdayEnd) {
                startOfShift = yesterdayStart;
                endOfShift = yesterdayEnd;
            }
            
            const diffMs = endOfShift - now;
            
            if (now < startOfShift) {
                // Belum mulai
                const fullDiffMs = endOfShift - startOfShift;
                const h = Math.floor(fullDiffMs / (1000 * 60 * 60));
                const m = Math.floor((fullDiffMs % (1000 * 60 * 60)) / (1000 * 60));
                
                labelText.innerText = "DURASI SHIFT NANTI";
                shiftText.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
                shiftText.className = "text-2xl font-mono font-bold text-stone-400 tabular-nums tracking-tighter drop-shadow-sm transition-all";
            } else if (now >= startOfShift && now < endOfShift) {
                // Sedang berjalan
                const h = Math.floor(diffMs / (1000 * 60 * 60));
                const m = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diffMs % (1000 * 60)) / 1000);
                
                labelText.innerText = "SISA WAKTU KERJA";
                shiftText.innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                shiftText.className = "text-3xl font-mono font-bold text-stone-700 dark:text-stone-200 tabular-nums tracking-tighter drop-shadow-sm transition-all";
            } else {
                // Sudah selesai
                labelText.innerText = "";
                shiftText.innerText = "Shift hari ini telah selesai 🎉";
                shiftText.className = "text-sm sm:text-base font-bold text-teal-600 dark:text-teal-400 drop-shadow-sm transition-all mt-1";
            }
        }

        function updateProgressBar() {
            const now = new Date();
            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const totalMs = 24 * 60 * 60 * 1000;
            const elapsedMs = now - startOfDay;
            let percent = (elapsedMs / totalMs) * 100;
            
            const bar = document.getElementById('holiday-progress');
            const footnote = document.getElementById('holiday-footnote');
            if (!bar || !footnote) return;

            bar.style.width = percent + '%';
            let colorClass = 'bg-emerald-400';
            let textColor = 'text-emerald-700 dark:text-emerald-300';
            
            if (percent >= 50 && percent < 80) { colorClass = 'bg-amber-400'; textColor = 'text-amber-800 dark:text-amber-300'; }
            else if (percent >= 80) { colorClass = 'bg-rose-500'; textColor = 'text-rose-800 dark:text-rose-300'; }

            bar.className = `absolute top-0 left-0 h-full rounded-full transition-all duration-1000 ${colorClass}`;
            
            const remainingMs = totalMs - elapsedMs;
            const remainingHours = Math.floor(remainingMs / (1000 * 60 * 60));
            const remainingMins = Math.floor((remainingMs % (1000 * 60 * 60)) / (1000 * 60));
            const remainingSecs = Math.floor((remainingMs % (1000 * 60)) / 1000);
            
            footnote.className = `text-xs font-mono font-bold mt-3 text-center tracking-wide break-words transition-colors duration-1000 ${textColor}`;
            footnote.innerText = `Sisa Hari Ini: ${String(remainingHours).padStart(2, '0')}:${String(remainingMins).padStart(2, '0')}:${String(remainingSecs).padStart(2, '0')}`;
        }

        function renderDashboard() {
            const card = document.getElementById('main-card');
            const content = document.getElementById('dashboard-content');
            const spinner = document.getElementById('loading-spinner');
            
            spinner.classList.add('hidden');
            content.classList.remove('hidden');

            const status = calculateStatus();
            if (progressInterval) clearInterval(progressInterval);

            let nextHolidayText = 'Belum Ada';
            if(status.nextHolidayStr) {
                const options = { weekday: 'long', day: 'numeric', month: 'long' };
                nextHolidayText = new Date(status.nextHolidayStr).toLocaleDateString('id-ID', options);
            }

            if (status.isHolidayToday) {
                card.className = "w-full rounded-[2rem] p-8 transition-all duration-500 relative overflow-hidden holiday-card-bg border-none min-h-[320px] flex flex-col items-center justify-center shadow-lg";
                content.innerHTML = `
                    <div class="text-6xl animate-sun mb-3 drop-shadow-sm select-none opacity-0 animate-[fadeInUp_0.6s_ease-out_0.1s_forwards]">🔆</div>
                    <h2 class="text-3xl font-extrabold text-orange-900 dark:text-orange-100 tracking-tight drop-shadow-sm mb-5 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.2s_forwards]">Libur</h2>
                    
                    <div class="w-full max-w-[80%] opacity-0 animate-[fadeInUp_0.6s_ease-out_0.3s_forwards]">
                        <div class="h-1.5 w-full bg-black/10 dark:bg-white/10 rounded-full overflow-hidden relative">
                            <div id="holiday-progress" class="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 w-0 bg-emerald-500 shadow-sm"></div>
                        </div>
                        <div id="holiday-footnote" class="text-xs font-mono font-bold mt-3 text-center tracking-wide break-words text-emerald-700 dark:text-emerald-300">...</div>
                    </div>

                    <div class="mt-8 flex flex-col items-center space-y-4 w-full opacity-0 animate-[fadeInUp_0.6s_ease-out_0.4s_forwards]">
                        <div class="text-center bg-white/20 dark:bg-black/20 px-6 py-3 rounded-2xl w-full max-w-[250px] shadow-sm">
                            <p class="text-[9px] text-orange-800/70 dark:text-orange-200/70 font-bold uppercase tracking-widest mb-1">Libur Berikutnya</p>
                            <p class="text-orange-900 dark:text-orange-100 font-bold text-sm truncate">${nextHolidayText}</p>
                            ${status.nextHolidayStr ? `<div class="mt-2 inline-block bg-orange-900/10 dark:bg-orange-100/10 px-2 py-0.5 rounded text-[10px] font-bold text-orange-800 dark:text-orange-200 border border-orange-900/5 dark:border-orange-100/5 shadow-sm">Jarak: ${status.workingDaysLeft} Hari Kerja</div>` : ''}
                        </div>
                    </div>
                `;
                updateProgressBar();
                progressInterval = setInterval(updateProgressBar, 1000); 
            } else {
                card.className = "w-full rounded-[2rem] p-8 transition-all duration-500 relative overflow-hidden bg-white dark:bg-stone-900 border border-stone-100 dark:border-stone-800 shadow-[0_8px_30px_rgb(0,0,0,0.04)] min-h-[320px] flex flex-col items-center justify-center";
                
                if (status.nextHolidayStr) {
                    content.innerHTML = `
                        <h2 class="text-stone-400 dark:text-stone-500 font-bold uppercase tracking-[0.2em] text-[10px] mb-2 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.1s_forwards]">MENUJU LIBUR</h2>
                        
                        <div class="mb-1 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.2s_forwards] flex items-baseline justify-center gap-2">
                            <span class="text-[6rem] leading-[1] font-black text-stone-800 dark:text-white tracking-tighter drop-shadow-sm">${status.workingDaysLeft}</span>
                        </div>
                        
                        <div class="flex flex-col items-center justify-center gap-1 mb-8 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.3s_forwards]">
                            <span class="text-stone-500 dark:text-stone-400 font-bold text-sm uppercase tracking-widest">Hari Kerja</span>
                            <span class="text-stone-400 dark:text-stone-500 font-semibold text-xs tracking-wide">${status.totalCalendarDays} Hari Total</span>
                        </div>
                        
                        <div class="flex flex-col space-y-5 w-full max-w-[250px] opacity-0 animate-[fadeInUp_0.6s_ease-out_0.4s_forwards]">
                            
                            <div class="text-center h-12 flex flex-col items-center justify-center">
                                <p id="shift-countdown-label" class="text-[10px] text-stone-400 dark:text-stone-500 font-bold uppercase tracking-widest mb-1.5 transition-colors"></p>
                                <p id="shift-countdown-text" class="text-3xl font-mono font-bold text-stone-700 dark:text-stone-200 tabular-nums tracking-tighter drop-shadow-sm">--:--:--</p>
                            </div>

                            <div class="text-center pt-3 border-t border-stone-100 dark:border-stone-800">
                                <p class="text-[9px] text-stone-400 dark:text-stone-500 font-bold uppercase tracking-widest mb-1.5">Libur Berikutnya</p>
                                <p class="text-stone-700 dark:text-stone-200 font-bold text-sm">${nextHolidayText}</p>
                            </div>
                        </div>
                    `;
                } else {
                    content.innerHTML = `
                        <div class="text-5xl select-none pointer-events-none mb-4 opacity-0 animate-[fadeInUp_0.6s_ease-out_0.1s_forwards]">📅</div>
                        <h2 class="text-xl font-black text-stone-800 dark:text-white mb-2 tracking-tight opacity-0 animate-[fadeInUp_0.6s_ease-out_0.2s_forwards]">Belum Ada Libur</h2>
                        
                        <div class="mt-6 w-full max-w-[250px] opacity-0 animate-[fadeInUp_0.6s_ease-out_0.4s_forwards]">
                            <div class="h-12 flex flex-col items-center justify-center">
                                <p id="shift-countdown-label" class="text-[10px] text-stone-400 dark:text-stone-500 font-bold uppercase tracking-widest mb-1.5 transition-colors"></p>
                                <p id="shift-countdown-text" class="text-3xl font-mono font-bold text-stone-700 dark:text-stone-200 tabular-nums tracking-tighter drop-shadow-sm">--:--:--</p>
                            </div>
                        </div>
                    `;
                }
                
                window.updateWorkdayCountdown();
                progressInterval = setInterval(window.updateWorkdayCountdown, 1000); 
            }
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if(!grid) return;
            
            document.getElementById('calendar-card').classList.remove('hidden');
            grid.innerHTML = '';
            
            const year = currentViewDate.getFullYear();
            const month = currentViewDate.getMonth();
            const monthName = new Date(year, month).toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            document.getElementById('current-month-display').innerText = monthName;

            let firstDay = new Date(year, month, 1).getDay();
            firstDay = firstDay === 0 ? 6 : firstDay - 1; 
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            const today = new Date();
            today.setHours(0,0,0,0);
            const todayStr = toYYYYMMDD(today);

            for (let i = 0; i < firstDay; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateStr = toYYYYMMDD(dateObj);
                
                const isPast = dateStr < todayStr;
                const isHoliday = selectedDates.includes(dateStr);
                const isYukyu = yukyuDates.includes(dateStr);
                const hasCustomShift = appSettings.customShifts && appSettings.customShifts[dateStr] !== undefined;
                const isToday = dateStr === todayStr;
                
                const btnContainer = document.createElement('div');
                btnContainer.className = "flex justify-center relative";

                const btn = document.createElement('div');
                let baseClasses = "w-8 h-8 rounded-full flex flex-col items-center justify-center text-[12px] font-semibold transition-all duration-300 select-none z-10 ";
                
                if (isHoliday) {
                    if (isPast) {
                        baseClasses += "bg-teal-100/70 text-teal-400 dark:bg-teal-900/30 dark:text-teal-700 ";
                    } else {
                        baseClasses += "bg-teal-500 text-white shadow-[0_4px_12px_rgba(20,184,166,0.3)] transform scale-[1.05] ";
                    }
                } else if (isYukyu) {
                    if (isPast) {
                        baseClasses += "bg-rose-100/70 text-rose-400 dark:bg-rose-900/30 dark:text-rose-700 ";
                    } else {
                        baseClasses += "bg-rose-500 text-white shadow-[0_4px_12px_rgba(244,63,94,0.3)] transform scale-[1.05] ";
                    }
                } else {
                    baseClasses += "bg-stone-50 dark:bg-stone-800 border border-stone-100 dark:border-stone-700 ";
                    if (isPast) {
                        baseClasses += "text-stone-300 dark:text-stone-600 ";
                    } else {
                        baseClasses += "text-stone-600 dark:text-stone-300 ";
                    }
                }

                // VISUAL INDICATOR HARI INI
                if (isToday) {
                    baseClasses += " ring-2 ring-teal-500 ring-offset-2 dark:ring-offset-stone-900 ";
                }
                
                btn.className = baseClasses;
                
                if (isYukyu) {
                    btn.innerHTML = `<span class="leading-none mt-1">${day}</span><span class="block text-[8px] leading-[0.5] mt-1 font-bold">Cuti</span>`;
                } else {
                    btn.innerHTML = `<span>${day}</span>`;
                }
                
                btnContainer.appendChild(btn);

                // Indikator Jam Custom
                if(hasCustomShift) {
                    const shiftData = appSettings.customShifts[dateStr];
                    let startStr = '';
                    
                    // Support legacy string format & new object format
                    if (typeof shiftData === 'string') {
                        const endStr = shiftData;
                        const [eHr, eMin] = endStr.split(':').map(Number);
                        const startHr = (eHr - 9 + 24) % 24;
                        startStr = `${String(startHr).padStart(2,'0')}:${String(eMin).padStart(2,'0')}`;
                    } else {
                        startStr = shiftData.start;
                    }
                    
                    const badge = document.createElement('div');
                    let badgeClass = "absolute -bottom-[18px] left-1/2 -translate-x-1/2 text-[7px] leading-none font-bold text-blue-600 bg-blue-100 dark:bg-blue-900/60 dark:text-blue-300 px-1 py-0.5 rounded shadow-sm whitespace-nowrap z-20 pointer-events-none";
                    
                    if(isPast) {
                        badgeClass = "absolute -bottom-[18px] left-1/2 -translate-x-1/2 text-[7px] leading-none font-bold text-blue-400/70 bg-blue-50/50 dark:bg-blue-900/20 dark:text-blue-700 px-1 py-0.5 rounded whitespace-nowrap z-20 pointer-events-none";
                    }
                    
                    badge.className = badgeClass;
                    badge.innerText = startStr;
                    btnContainer.appendChild(badge);
                }

                grid.appendChild(btnContainer);
            }
        }

        window.submitMessage = async function() {
            const textInput = document.getElementById('msg-text');
            const btnSubmit = document.getElementById('btn-submit-msg');
            
            const name = forName || "Anonim";
            const text = textInput.value.trim();
            
            if(!text) {
                showModal("Oops!", "Tolong isi pesannya dulu ya.", false);
                return;
            }
            
            // Loading state
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<div class="w-5 h-5 border-2 border-stone-400 border-t-white rounded-full animate-spin"></div>`;
            
            try {
                // Ensure auth before writing
                if(!auth.currentUser) await signInAnonymously(auth);

                // Menulis ke koleksi private data Heri
                const msgRef = collection(db, 'artifacts', appIdString, 'users', targetUserId, 'messages');
                await addDoc(msgRef, {
                    sender: name,
                    message: text,
                    timestamp: new Date().toISOString(),
                    isRead: false
                });
                
                showModal("Terkirim!", "Pesan kamu berhasil dikirim ke Heri. Terima kasih!", true);
                textInput.value = ''; // Reset only the message, keep name if they want to send another
                
            } catch(e) {
                console.error("Gagal mengirim pesan:", e);
                showModal("Gagal Mengirim", "Maaf, terjadi kesalahan saat mengirim pesan. Coba lagi nanti ya.", false);
            } finally {
                // Reset button state
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `
                    <span>Kirim Pesan</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                `;
            }
        }

        // Jalankan Firebase Read-Only saat dimuat
        window.onload = async () => {
            try {
                await signInAnonymously(auth);
                
                const userRef = doc(db, 'artifacts', appIdString, 'users', targetUserId, 'data', 'state');
                
                onSnapshot(userRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const cloudData = docSnap.data();
                        if (cloudData.settings) {
                            appSettings = { ...appSettings, ...cloudData.settings };
                            if(!appSettings.overtimeLogs) appSettings.overtimeLogs = {};
                            if(!appSettings.customShifts) appSettings.customShifts = {};
                        }
                        if (cloudData.holidays) selectedDates = cloudData.holidays;
                        if (cloudData.yukyu) yukyuDates = cloudData.yukyu;
                    }
                    
                    applyTheme();
                    renderDashboard();
                    renderCalendar(); 
                }, (error) => {
                    console.error("Firebase Error:", error);
                    document.getElementById('loading-spinner').classList.add('hidden');
                    document.getElementById('dashboard-content').classList.remove('hidden');
                    document.getElementById('dashboard-content').innerHTML = `<p class="text-rose-500 text-sm font-bold">Gagal memuat data jadwal.</p>`;
                });

            } catch(e) {
                console.error("Auth Error:", e);
                document.getElementById('loading-spinner').classList.add('hidden');
                document.getElementById('dashboard-content').classList.remove('hidden');
                document.getElementById('dashboard-content').innerHTML = `<p class="text-rose-500 text-sm font-bold">Gagal menghubungkan ke server.</p>`;
            }
        };
    </script>
